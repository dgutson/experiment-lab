<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Lab{% endblock %} · Lab</title>
<style>
:root { color-scheme: light dark; --bg: #ffffff; --fg: #1f2328; --muted: #656d76; --line: #d0d7de; --head: #f6f8fa; --link: #0969da; --open: #9a6700; --bad: #cf222e; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #0d1117; --fg: #e6edf3; --muted: #8d96a0; --line: #30363d; --head: #161b22; --link: #4493f8; --open: #d29922; --bad: #f85149; }
}
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
nav { display: flex; flex-wrap: wrap; gap: 16px; align-items: baseline; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--head); }
main { padding: 16px; max-width: 1400px; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
h1 { font-size: 22px; margin: 4px 0 8px; }
h2 { font-size: 18px; margin: 24px 0 8px; }
h3 { font-size: 15px; margin: 16px 0 6px; color: var(--muted); }
.meta, .note { color: var(--muted); }
.note { font-size: 13px; margin: 2px 0 12px; }
.scroll { overflow-x: auto; }
.diagram { margin: 8px 0; overflow-x: auto; }
table { border-collapse: collapse; margin: 6px 0; font-size: 14px; }
th, td { border: 1px solid var(--line); padding: 3px 8px; vertical-align: top; text-align: left; }
th { background: var(--head); white-space: nowrap; }
table.sortable th { cursor: pointer; user-select: none; }
th[data-dir="up"]::after { content: " ▲"; }
th[data-dir="down"]::after { content: " ▼"; }
td.n { text-align: right; font-variant-numeric: tabular-nums; }
pre, code { background: var(--head); font-family: ui-monospace, monospace; font-size: 13px; }
pre { padding: 8px; white-space: pre-wrap; }
tr.open td, span.open { color: var(--open); font-weight: 600; }
tr.superseded td, span.superseded { color: var(--muted); text-decoration: line-through; }
.error { color: var(--bad); white-space: pre-wrap; }
textarea { box-sizing: border-box; width: 100%; font: 13px ui-monospace, monospace; background: var(--bg); color: var(--fg); border: 1px solid var(--line); padding: 6px; }
nav select, input[type="search"] { font: inherit; background: var(--bg); color: var(--fg); border: 1px solid var(--line); padding: 2px 8px; }
nav select { font-weight: 600; }
.find { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin: 10px 0 4px; }
.find input[type="search"] { width: 20em; max-width: 100%; }
.path { color: var(--muted); font-size: 13px; margin: 0; }
.group { border-left: 2px solid var(--line); padding: 2px 0 2px 12px; margin: 14px 0; }
.group h2 { margin-top: 0; }
td.tree { white-space: nowrap; }
.branch { font-family: ui-monospace, monospace; color: var(--muted); white-space: pre; }
tr.root td { background: var(--head); font-weight: 600; }
tr.dead-end td { color: var(--muted); }
audio, img.media { display: block; max-width: 100%; margin: 4px 0; }
img.media { max-height: 320px; }
button.danger { background: var(--bad); color: var(--bg); border: 1px solid var(--bad); border-radius: 4px; padding: 2px 8px; cursor: pointer; }
dialog { background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; max-width: min(36em, calc(100vw - 32px)); padding: 16px 20px; }
dialog::backdrop { background: rgb(0 0 0 / 45%); }
dialog h2 { margin-top: 0; }
.buttons { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
</style>
</head>
<body>
<nav>
  <strong>Lab</strong>
  {% if picker and projects %}<select aria-label="Project" onchange="document.cookie = 'project=' + encodeURIComponent(this.value) + '; path=/; max-age=31536000; samesite=lax'; const u = new window.URL(location.href); u.searchParams.delete('project'); location.href = u">
    {% for p in projects %}<option{% if p == project %} selected{% endif %}>{{ p }}</option>{% endfor %}
  </select>{% endif %}
  <a href="/lab/">Records</a>
  <a href="/lab/experiments">Experiments</a>
  <a href="/lab/query">Views and query</a>
  <a href="/lab/file">Files</a>
  <a href="/lab/projects">Projects</a>
  <a href="/lab/about">About</a>
</nav>
<main>{% block main %}{% endblock %}</main>
<script>
// Click a heading of a sortable table to sort its rows; numbers sort as numbers.
document.querySelectorAll("table.sortable").forEach(t => {
  t.querySelectorAll("th").forEach((th, i) => th.addEventListener("click", () => {
    const up = th.dataset.dir !== "up";
    t.querySelectorAll("th").forEach(h => delete h.dataset.dir);
    th.dataset.dir = up ? "up" : "down";
    const key = row => {
      const s = row.cells[i].innerText.trim();
      return s !== "" && isFinite(s) ? Number(s) : s.toLowerCase();
    };
    const rows = Array.from(t.tBodies[0].rows);
    rows.sort((a, b) => {
      const x = key(a), y = key(b);
      const c = typeof x === typeof y ? (x < y ? -1 : x > y ? 1 : 0) : (typeof x === "number" ? -1 : 1);
      return up ? c : -c;
    });
    rows.forEach(row => t.tBodies[0].appendChild(row));
  }));
});

// Draws each ```mermaid block of the Markdown as a diagram with the copy of
// mermaid.js in static/ (the version mmdc uses), fetched only by pages that
// have such a block. The colors follow the light or dark scheme, also when it
// changes. A block that does not parse keeps its text, with Mermaid's error above.
{
  const blocks = Array.from(document.querySelectorAll("pre > code.language-mermaid"), code => {
    const div = document.createElement("div");
    div.className = "diagram";
    code.parentElement.before(div);
    return {div, pre: code.parentElement, text: code.textContent};
  });
  const dark = matchMedia("(prefers-color-scheme: dark)");
  let draws = 0;
  const showError = (b, message) => {
    const pre = document.createElement("pre");
    pre.className = "error";
    pre.textContent = message;
    b.div.replaceChildren(pre);
    b.pre.hidden = false;
  };
  const draw = async () => {
    const n = ++draws;
    mermaid.initialize({startOnLoad: false, securityLevel: "strict", suppressErrorRendering: true,
                        theme: dark.matches ? "dark" : "default"});
    for (const [i, b] of blocks.entries()) {
      try {
        // A new id each draw: Mermaid first removes any element with the id it is given.
        const {svg} = await mermaid.render(`lab-diagram-${n}-${i}`, b.text);
        if (n !== draws) return;  // a newer draw has started
        b.div.innerHTML = svg;
        b.pre.hidden = true;
      } catch (e) {
        if (n !== draws) return;
        showError(b, `Mermaid could not draw this diagram:\n${e.message ?? e}`);
      }
    }
  };
  if (blocks.length) {
    const script = document.createElement("script");
    script.src = "/lab/static/mermaid-11.17.2.min.js";
    script.onload = () => { draw(); dark.addEventListener("change", draw); };
    script.onerror = () => blocks.forEach(b => showError(b, `mermaid.js did not load from ${script.src}`));
    document.body.append(script);
  }
}
</script>
</body>
</html>
