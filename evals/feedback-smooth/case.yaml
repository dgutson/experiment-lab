schema_version: "1.1"
name: feedback-smooth
description: After a session that used the lab without trouble (history.jsonl, a pick-parent run whose commands all worked), the person runs /experiment-lab:feedback; the agent says the lab served the session well and makes up no frictions.
context:
  scaffold_script: setup.sh
  history_file: history.jsonl
execution:
  prompt: /experiment-lab:feedback
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 30
  timeout_seconds: 600
graders:
  - name: draft-made
    type: tool_used
    tool: Bash
    input_match: experiment_lab.feedback draft
  - name: not-sent
    type: tool_used
    tool: Bash
    input_match: experiment_lab.feedback send
    min: 0
    max: 0
  - name: nothing-made-up
    type: llm
    focus: trace
    criteria: |
      In the earlier session every rec and q command worked. PASS if the agent's last message says,
      briefly, that the lab served the session well, and either sends nothing or offers only a short
      report. FAIL if it presents frictions with rec, q or lab.py, or features the lab lacks, that the
      earlier session does not show.
