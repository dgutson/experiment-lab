schema_version: "1.1"
name: param-script
description: A report script reads runs back with lab.runs and orders them by a numeric param.
context:
  scaffold_script: setup.sh
execution:
  prompt: |
    Write report.py, which reads the runs of the batch size sweep with lab.runs and prints each batch size with
    its mean accuracy over the seeds, from the smallest batch size to the largest. Run it.
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 30
  timeout_seconds: 600
graders:
  - name: skill-used
    type: tool_used
    tool: Skill
    input_match: experiment-db
  - name: reads-with-lab-runs
    type: regex
    target: trace
    pattern: 'lab\.runs\('
  - name: report-in-order
    type: llm
    focus: trace
    criteria: |
      PASS if report.py ran without an error and its printed output lists the 11 batch sizes 1, 2, 4, 8, 16, 32,
      64, 128, 256, 512 and 1024 in that order, each with its mean accuracy (0.70, 0.74, 0.78, 0.81, 0.86, 0.90,
      0.89, 0.84, 0.80, 0.75, 0.69, to two decimals). FAIL if the script failed, a size is missing, a mean is
      wrong, or the sizes are printed in another order (such as 1, 1024, 128, 16, 2, ..., the order as text).
