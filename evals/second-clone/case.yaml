---
schema_version: "1.1"
name: second-clone
description: In another clone of the repository whose first clone is audio-codec's folder, the agent logs runs in audio-codec with no failed lab command.
context:
  scaffold_script: setup.sh
execution:
  prompt: |
    Log bench.py's runs in the lab, in a new experiment: one run per frame size, with its time as a
    metric.
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 30
  timeout_seconds: 600
graders:
  - name: skill-used
    type: tool_used
    tool: Skill
    input_match: experiment-db
  - name: no-project-made
    type: tool_used
    tool: Bash
    input_match: rec project
    min: 0
    max: 0
  - name: no-project-error
    type: regex
    target: trace
    pattern: '^(?![\s\S]*no project holds /)'
  - name: runs-logged
    type: regex
    target: trace
    pattern: 'with lab\.run\(|rec run '
