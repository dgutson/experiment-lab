schema_version: "1.1"
name: param-sql
description: A question that compares and orders a numeric param is answered with q, the param being text in the views.
context:
  scaffold_script: setup.sh
execution:
  prompt: |
    Which batch sizes above 100 did the batch size sweep try? List them from smallest to largest, each with its
    mean accuracy over the seeds.
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 30
  timeout_seconds: 600
graders:
  - name: skill-used
    type: tool_used
    tool: Skill
    input_match: experiment-db
  - name: used-q
    type: tool_used
    tool: Bash
    input_match: '\bq '
  - name: right-sizes-in-order
    type: llm
    focus: trace
    criteria: |
      PASS if the agent's final answer gives the batch sizes above 100 as exactly 128, 256, 512 and 1024, in that
      order (smallest to largest), with the mean accuracies 0.84, 0.80, 0.75 and 0.69 respectively. Smaller sizes
      mentioned apart, as not above 100, do not matter. FAIL if a size above 100 is missing, a size of 100 or less
      is given as above 100, the order differs, or a mean accuracy is wrong.
