schema_version: "1.1"
name: cited-file
description: A script reads a run's logged file that a finding cites, with nothing in it to correct; what it costs that the lab names the finding.
context:
  scaffold_script: setup.sh
execution:
  prompt: |
    Write kinds.py, which prints the mean score of the speech clips and of the music clips that the
    listening test's panel 1 run logged. Run it.
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 30
  timeout_seconds: 600
graders:
  - name: skill-used
    type: tool_used
    tool: Skill
    input_match: experiment-db
  - name: file-means
    type: llm
    focus: trace
    criteria: |
      PASS if kinds.py's last run printed a mean of 4.0 for speech and 3.6 for music, the means of the logged
      clips.json as it is. FAIL if it printed other means or its last run failed.
