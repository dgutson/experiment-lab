[project]
name = "experiment-lab"
version = "0.3.0"
description = "Decisions, findings, protocol rules and questions about experiments, next to the experiments' runs: q, rec and the /lab pages."
requires-python = ">=3.12"
authors = [{name = "Daniel Gutson"}]
# pytz for DuckDB's Python client to return a TIMESTAMP WITH TIME ZONE value
dependencies = ["duckdb==1.5.6", "fastapi==0.143.0", "jinja2==3.1.6", "markdown==3.11", "pytz==2026.5",
                "uvicorn==0.54.0"]

# the About page's links
[project.urls]
Repository = "https://github.com/dgutson/experiment-lab"
Author = "https://github.com/dgutson"

[project.scripts]
q = "experiment_lab.q:main"
rec = "experiment_lab.rec:main"
lab-server = "experiment_lab.pages:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The checks' tools, which uv sync installs into .venv; Playwright for the type checkers to read
# checks/check_pages.py, and types-Markdown for mypy to read markdown
[dependency-groups]
dev = ["mypy==2.4.0", "types-Markdown==3.10.2.20261007", "pyright==1.1.414", "ruff==0.17.2", "pylint==4.1.3",
       "pylint-complex-struct==0.2.2", "playwright==1.63.0"]

[tool.mypy]
files = ["experiment_lab", "checks"]
mypy_path = "evals"  # make_lab, which checks/make_scratch.py imports
strict = true

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["experiment_lab", "checks"]
extraPaths = ["evals"]  # make_lab, which checks/make_scratch.py imports

# Only the annotation rules: every function's parameters and return are annotated
[tool.ruff.lint]
select = ["ANN"]

# Only pylint-complex-struct's messages: annotations that nest too deep, and a
# returned tuple of different types, which should be a NamedTuple. pylint
# otherwise exits 0 when the plugin does not load, having checked nothing.
[tool.pylint.main]
load-plugins = ["pylint_complex_struct"]
fail-on = ["bad-plugin-value", "unknown-option-value"]

[tool.pylint."messages control"]
disable = ["all"]
enable = ["complex-type-annotation", "complex-type-alias", "tuple-should-be-namedtuple"]
