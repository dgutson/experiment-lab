{% extends "lab/base.html" %}
{% block title %}{{ shown }}{% endblock %}
{% block main %}
<h1>{{ shown }}</h1>
{% if parent %}<p><a href="{{ url_for('lab.file_page', path=parent) }}">↑ {{ parent }}</a></p>{% endif %}
<table class="sortable">
<thead><tr><th>Name</th><th>Bytes</th></tr></thead>
<tbody>
{% for i in items %}<tr><td><a href="{{ url_for('lab.file_page', path=i.path) }}">{{ i.name }}</a></td><td class="n">{{ i.size }}</td></tr>
{% endfor %}
</tbody>
</table>
{% endblock %}
